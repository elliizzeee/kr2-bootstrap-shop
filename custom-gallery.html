<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Галерея работ на заказ – Wood & Resin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
  <style>
    /* Стили для Pinterest-сетки */
    .gallery-masonry {
      column-count: 3; 
      column-gap: 1.5rem;
    }
    .gallery-item {
      break-inside: avoid; 
      margin-bottom: 1.5rem;
    }
    .gallery-item img, .gallery-item video {
      width: 100%;
      height: auto; 
      border-radius: 10px;
      border: 1px solid #4a3f38;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .gallery-item img:hover, .gallery-item video:hover {
      transform: scale(1.03);
      box-shadow: 0 10px 25px rgba(230, 185, 125, 0.3);
    }

    /* Адаптивность */
    @media (max-width: 992px) {
      .gallery-masonry { column-count: 2; }
    }
    @media (max-width: 576px) {
      .gallery-masonry { column-count: 1; }
    }
  </style>
</head>
<body>

  <!-- Навигация -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
          <li class="nav-item"><a class="nav-link" href="houses.html">Домики</a></li>
          <li class="nav-item"><a class="nav-link" href="catalog.html">Мастер-классы</a></li>
          <li class="nav-item"><a class="nav-link" href="gallery.html">Галерея</a></li>
          <li class="nav-item"><a class="nav-link active" href="shop.html">Магазин</a></li>
          <li class="nav-item"><a class="nav-link" href="order.html">Бронирование</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <div class="mb-4">
      <a href="shop.html" class="btn btn-outline-secondary btn-sm">&larr; Назад в магазин</a>
    </div>

    <div class="text-center mb-5">
      <h1 class="h2 fw-bold" style="color: #f5e6d3; text-shadow: 0 0 10px rgba(245,230,211,0.5);">Наши работы на заказ</h1>
      <p class="lead text-muted">Вдохновитесь нашими проектами и закажите что-то уникальное</p>
    </div>

    <!-- Сетка галереи -->
    <div class="gallery-masonry">
      
      <!-- ВИДЕО (Автовоспроизведение без звука) -->
      <div class="gallery-item">
        <!-- Замени images/process.mp4 на название твоего видеофайла -->
        <video src="images/process.mp4" autoplay loop muted playsinline class="w-100" onerror="this.style.display='none'"></video>
      </div>

      <div class="gallery-item"><img src="images/галереяработ9.jpg" alt="Шахматы 2"></div>
      <div class="gallery-item"><img src="images/галереяработ8.jpg" alt="Шахматы"></div>
      <div class="gallery-item"><img src="images/галереяработ5.jpg" alt="Стол-айсберг"></div>
      <div class="gallery-item"><img src="images/галереяработ6.jpg" alt="Стол-водопад"></div>
      <div class="gallery-item"><img src="images/галереяработ2.jpg" alt="Светящиеся часы"></div>
      <div class="gallery-item"><img src="images/галереяработ1.jpg" alt="Часы с кристаллами"></div>
      <div class="gallery-item"><img src="images/галереяработ3.jpg" alt="Стол с сотами"></div>
      <div class="gallery-item"><img src="images/галереяработ7.jpg" alt="Зеленый остров"></div>
      <div class="gallery-item"><img src="images/галереяработ4.jpg" alt="Кухонная столешница"></div>
      <div class="gallery-item"><img src="images/галереяработ10.jpg" alt="Стол с мрамором"></div>

    </div>

    <div class="text-center mt-5">
      <h3 class="h4" style="color: #f5e6d3;">Хотите так же?</h3>
      <p class="text-muted mb-4">Обсудите свой проект с нашим мастером</p>
      <a href="shop.html" class="btn btn-primary btn-lg px-5" style="background-color: #3b5e40; border: none;">Обсудить свой заказ</a>
    </div>

  </main>

  <!-- Подвал -->
  <footer class="bg-dark text-white py-5 mt-5 border-top border-secondary">
    <div class="container text-center">
      <p class="mb-0 text-muted">&copy; 2026 Wood & Resin. Учебный проект.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
